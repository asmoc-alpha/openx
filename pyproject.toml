[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openx"
version = "0.1.8"
description = "OpenX - An open-source, verifiable and evolvable agent runtime"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "OpenX Contributors"}
]
keywords = ["cli", "coding-agent", "ai", "llm", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

dependencies = [
    "openai>=1.0.0",
    # rich 私有接口依赖（Live._lock / LiveRender._shape / Console._lock，
    # 见 services/streaming.py _ResizeAwareLive）：rich 13 的 stop() 最终
    # 刷新 early-return 语义与 done/cancel 的光标算术假设不符；14 与 15
    # 行为一致（已字节码级比对）。升级 16 前须复检上述私有面。
    "rich>=14,<16",
    # rich 的 Markdown 解析链（markdown-it-py → mdurl）：mdurl 0.1.0 的
    # _parse 在空 host URL（模型吐出的 `[a](//)`）上越界 IndexError，
    # IndexError 不是 rich 兜的 ValueError——异常从流式渲染里穿出会直接
    # 终结会话（用户报告的崩溃）。0.1.1 修复空 host。代码侧另有
    # _markdown_safe 兜底（覆盖今后任何解析器异常），此处是让畸形链接
    # 仍能正常渲染成链接的根修。
    "mdurl>=0.1.1",
    "httpx>=0.25.0",
    "pyperclip>=1.8.0",
]

[project.optional-dependencies]
# anthropic 原生 provider（llm/anthropic.py）的可选依赖：缺失时该实现
# 不注册（builtin-providers 跳过，非失败）--可选依赖不是产品缺陷。
anthropic = [
    "anthropic>=0.40.0",
]
# openx serve（Web 端，P4）：缺失时 serve 命令给清晰报错、其余功能不受影响
web = [
    "aiohttp>=3.9",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    # 终端 UI 测试的屏幕模拟器（pyte）与 pty 端到端测试依赖
    "pyte>=0.8.1",
    # serve/Web 端测试依赖（aiohttp.test_utils 起真服务）
    "aiohttp>=3.9",
]

[project.scripts]
openx = "openx.main:main"

[tool.hatch.build.targets.wheel]
packages = ["openx"]

# serve 静态前端资源随 wheel 打包（hatch 默认只收 .py）
[tool.hatch.build.targets.wheel.force-include]
"openx/app/serve/web" = "openx/app/serve/web"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
